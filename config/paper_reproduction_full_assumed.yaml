# ASSUMED-UNIT configuration (2026-11-10). The FES unit and construction are NOT confirmed by
# the authors. Assumptions: (1) energies in kJ/mol, the PLUMED default and the unit used by the
# supplied script (KB_KJMOLK) and the primary article; (2) FES_AB_40.dat is the sum_hills free
# energy ("file.free") of the three replicas combined, as described in the article.
# Every result produced with this file must be reported as conditional on these assumptions.
# Published-parameter configuration with the full profile enabled after resource review.
# Review (2026-11-10): medium profile (3 x 10,000 frames) measured 36 s and 0.70 GiB peak
# (run 20261110T145118-444c34a2); DPC cost scales ~N^3 per group and the float32 distance
# matrix needs 3.6 GB at 30,000 frames, so a full run is estimated at <= 2 h and < 10 GiB.
# The full profile runs only the unweighted `cluster` command; weighting stays blocked.
project_root: ..
mode: paper_reproduction
profile: smoke
inputs:
  descriptors: data/raw/input_clustering_ab40.dat
  fes: data/raw/FES_AB_40.dat
  fes_energy_unit: kJ/mol
  fes_provenance: "ASSUMED, not confirmed by the authors: PLUMED sum_hills free energy (file.free) of the three combined replicas, in the PLUMED default unit kJ/mol, as used by the supplied script and the primary article"
  rbias_energy_unit: null
  rbias_provenance: null
replicas: 3
interval_ps: [1000000, 3000000]
temperature_K: 310.0
gamma_bias: 10.0
features: [nAlpha, nBeta, Rg, SASA]
representation: minmax
wasserstein: raw
master_seed: 42
dpc:
  nmax: 10
  min_cluster_size: 300
  silhouette_threshold: 0.3
  dc: 1.3
  dc_reduction: 0.9
  max_no_improve_steps: 5
consensus:
  spline_s: 5.0
bootstrap_draws: 500
profiles:
  smoke:
    group_size: 3000
    max_groups: 2
    seeds: 2
    max_seconds: 300
    max_memory_gib: 8
    enabled: true
  medium:
    group_size: 10000
    max_groups: 3
    seeds: 5
    max_seconds: 1800
    max_memory_gib: 16
    enabled: true
  full:
    group_size: 30000
    max_groups: null
    seeds: 20
    max_seconds: 86400
    max_memory_gib: 24
    enabled: true
