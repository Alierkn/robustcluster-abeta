project_root: ..
mode: paper_reproduction
profile: smoke
inputs:
  descriptors: data/raw/input_clustering_ab40.dat
  fes: data/raw/FES_AB_40.dat
  fes_energy_unit: null
  fes_provenance: null
  rbias_energy_unit: null
  rbias_provenance: null
replicas: 3
interval_ps: [1000000, 3000000]
temperature_K: 310.0
gamma_bias: 10.0
features: [nAlpha, nBeta, Rg, SASA]
representation: minmax
wasserstein: raw
master_seed: 42
dpc:
  nmax: 10
  min_cluster_size: 300
  silhouette_threshold: 0.3
  dc: 1.3
  dc_reduction: 0.9
  max_no_improve_steps: 5
consensus:
  spline_s: 5.0
bootstrap_draws: 500
profiles:
  smoke:
    group_size: 3000
    max_groups: 2
    seeds: 2
    max_seconds: 300
    max_memory_gib: 8
    enabled: true
  medium:
    group_size: 10000
    max_groups: 3
    seeds: 5
    max_seconds: 1800
    max_memory_gib: 16
    enabled: true
  full:
    group_size: 30000
    max_groups: null
    seeds: 20
    max_seconds: 86400
    max_memory_gib: 24
    enabled: false
